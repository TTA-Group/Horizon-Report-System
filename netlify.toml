# การตั้งค่า Netlify สำหรับ Horizon Report System
# - publish: โฟลเดอร์ static ของ LIFF (public/)
# - functions: Netlify Functions v2 (TypeScript) ทำหน้าที่เป็น REST API + webhook + งานตามเวลา

[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "public"

[functions]
  # ให้ esbuild รวม dependency (เช่น postgres) เข้าไปในบันเดิลของแต่ละฟังก์ชัน
  node_bundler = "esbuild"

# หมายเหตุ:
# - เส้นทางของแต่ละ API กำหนดในไฟล์ฟังก์ชันผ่าน `export const config = { path: "/api/..." }`
#   จึงไม่ต้องตั้ง redirect ของ /api ที่นี่
# - งานตามเวลา (reminders, db-keepalive, ฯลฯ) กำหนด `schedule` ในไฟล์ฟังก์ชันเช่นกัน
