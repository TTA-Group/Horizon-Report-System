# การตั้งค่า Cloudflare Workers สำหรับ Horizon Wellness — ระบบจองคิวนวด
#
# deploy แยกจากอีกสองระบบ:  npx wrangler deploy --config wrangler.massage.toml
#
# ใช้ฐานข้อมูลตัวเดียวกับระบบอื่น จึงต้องตั้งค่าเหล่านี้ที่ Worker ตัวนี้ด้วย
# (Settings → Variables and Secrets ทุกตัวต้องเป็นชนิด Secret):
#   DATABASE_URL                — สายเชื่อมต่อแบบ Transaction pooler ของ Supabase
#   LINE_LOGIN_CHANNEL_ID       — ตรวจบัตรประจำตัวจากไลน์
#   LINE_CHANNEL_ACCESS_TOKEN   — ส่งการ์ดยืนยันและข้อความเตือน
#   LINE_CHANNEL_SECRET         — ใช้เซ็นลิงก์ฟอร์มเช็คชื่อ
#   ADMIN_EMPLOYEE_CODES        — ทางสำรองของสิทธิ์ผู้ดูแล (ปกติดูจากฝ่าย HR ในฐานข้อมูล)
#
# ค่าลับห้ามใส่ลงไฟล์นี้เพราะไฟล์นี้อยู่ใน repo สาธารณะ

name = "massage"
main = "src/massage.ts"
compatibility_date = "2025-01-01"

# postgres ต้องใช้ TCP · node:crypto ใช้ตรวจ ID token ของไลน์และเซ็นลิงก์ฟอร์ม
compatibility_flags = ["nodejs_compat"]

# หน้าเว็บของระบบจองคิวนวด — คนละชุดกับ public/ และ public-core/
# หน้านี้ไม่ได้ถูกแชร์เป็นลิงก์ในแชท จึงไม่ต้องเติมโดเมนใน og:* แต่ยังต้องผ่าน Worker ด้วยเหตุผลข้างล่าง
# run_worker_first — เส้นทางที่ต้องผ่านโค้ดของเราก่อน ที่เหลือ Cloudflare เสิร์ฟตรงจากที่เก็บไฟล์
#
# ต้องมีครบทั้งสี่เส้นทางของ APP_SHELL (ดู api/_lib/assets.ts) เพราะ serveAsset ทำสองอย่าง
# ที่จำเป็นกับไฟล์เหล่านี้ และจะไม่ได้ทำเลยถ้าคำขอไม่วิ่งผ่าน Worker:
#   1. ตัดคอมเมนต์ออกก่อนส่ง — ไม่งั้นคนกด inspect element อ่านคำอธิบายในโค้ดได้หมด
#   2. ใส่ cache-control: no-store — ไม่งั้นเบราว์เซอร์ในแอปไลน์เก็บตัวแอปเก่าไว้แน่นมาก
# เดิมไม่ได้ตั้งไว้เลย ไฟล์ทุกไฟล์จึงถูกเสิร์ฟข้าม Worker และไม่ได้ทั้งสองอย่าง
[assets]
directory = "./public-massage"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/app.js", "/config.js"]

# ค่าที่เปิดเผยได้ ไม่ใช่ความลับ
#
# LIFF_ID คือรหัสหน้าเว็บของระบบจองใน LINE ฝั่ง Worker ต้องรู้เพราะต้องประกอบลิงก์
# ปุ่ม "ยกเลิกการจอง" บนการ์ดยืนยัน  ค่าเดียวกันนี้อยู่ใน public-massage/config.js
# ซึ่งเบราว์เซอร์ของทุกคนโหลดไปอยู่แล้ว
[vars]
LIFF_ID = "2008960303-qy15ZTtu"

# งานตามเวลา — ต้องตรงกับที่จับคู่ไว้ใน src/massage.ts (CRON_JOBS)
#
# ใช้ cron ตัวเดียวเพราะแผนฟรีของ Cloudflare ให้ตั้งได้ 5 ตัว "ต่อบัญชี" ไม่ใช่ต่อ Worker
# ทั้งสามงาน (สร้างวันของเดือน · เตือนล่วงหน้า 1 วัน · เตือนก่อนถึงคิว) อยู่ในตัวจัดการเดียวกัน
# ซึ่งดูนาฬิกาเองว่าถึงเวลาของงานไหน — ดู api/massage-cron.ts
[triggers]
crons = ["*/15 * * * *"]

# รหัสรุ่นที่ deploy อยู่จริง — /api/health เอาไปบอกว่าเครื่องกำลังรันของรอบไหน
#
# มีไว้เพราะเคยเสียเวลาไล่หาสาเหตุว่า "แก้แล้วทำไมหน้าจอไม่เปลี่ยน" โดยเดาเอาว่าเป็นแคช
# ทั้งที่ของใหม่ยังไม่ได้ deploy ขึ้นไปด้วยซ้ำ ต่อไปเปิด /api/health ดูเวลาที่ deploy ได้เลย
[version_metadata]
binding = "CF_VERSION"
