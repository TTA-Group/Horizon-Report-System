# การตั้งค่า Cloudflare Workers สำหรับ Horizon Report System
#
# Worker ตัวเดียวทำครบ: เสิร์ฟหน้าเว็บ LIFF (public/), รับ /api/*, และรันงานตามเวลา
#
# ค่าลับทั้งหมด (DATABASE_URL, LINE_*, STORAGE_*, ฯลฯ) ตั้งผ่านหน้าเว็บ Cloudflare
# ที่ Settings → Variables and Secrets — ห้ามใส่ลงไฟล์นี้เพราะไฟล์นี้อยู่ใน repo

# ต้องตรงกับชื่อ Worker ที่สร้างไว้ใน Cloudflare (ดูที่ Workers & Pages)
# ถ้าไม่ตรง คำสั่ง deploy จะล้มเหลวเพราะ build token ผูกกับ Worker ตัวใดตัวหนึ่งเท่านั้น
name = "report"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# nodejs_compat จำเป็นสำหรับ:
#   - postgres (ต่อฐานข้อมูลผ่าน TCP)
#   - node:crypto (ตรวจลายเซ็น webhook ของ LINE)
#   - Buffer (อ่าน/เขียนไฟล์แนบและไฟล์สำรอง)
compatibility_flags = ["nodejs_compat"]

# หน้าเว็บ LIFF — เสิร์ฟไฟล์ใน public/ โดยตรง
#
# run_worker_first ให้โค้ดทำงานก่อนเฉพาะหน้า HTML เพราะ Worker ต้องเติมชื่อโดเมนลงในแท็ก
# og:image / og:url ก่อนส่งออกไป (ดู absolutizeMeta ใน src/index.ts) ไม่งั้นตัวไต่ลิงก์ของไลน์
# จะได้เส้นทางเปล่า ๆ แล้วไม่ขึ้นภาพตัวอย่าง ส่วนไฟล์อื่นยังถูกเสิร์ฟตรงจากที่เก็บไฟล์เหมือนเดิม
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/", "/index.html"]

# ค่าที่เปิดเผยได้ ไม่ใช่ความลับ
#
# LIFF_ID คือรหัสหน้าเว็บใน LINE ที่ใช้เปิดแอปจากในแชท ค่าเดียวกันนี้อยู่ใน public/config.js
# ซึ่งเบราว์เซอร์ของทุกคนโหลดไปอยู่แล้ว จึงตั้งเป็น var ธรรมดาได้ ไม่ต้องเป็น Secret
# ฝั่ง Worker ต้องรู้ค่านี้ด้วยเพราะต้องประกอบลิงก์ "เปิดในแอป" ใส่ปุ่มบนการ์ดที่ส่งเข้าไลน์
[vars]
LIFF_ID = "2008960303-ci4AFC0z"

# งานตามเวลา (เวลาเป็น UTC) — ต้องตรงกับที่จับคู่ไว้ใน src/index.ts (CRON_JOBS)
#
# ⚠️ Cloudflare แผนฟรีให้ตั้ง cron ได้ 5 ตัว "ต่อบัญชี" ไม่ใช่ต่อ Worker
# ระบบนี้เคยใช้ครบ 5 ตัวคนเดียว จนระบบจองคิวนวดตั้ง cron เพิ่มไม่ได้เลย (error 10072)
# จึงยุบงานรายวัน/รายสัปดาห์/รายเดือนมาอยู่ใน cron ตัวเดียว แล้วให้ api/daily-jobs.ts
# ดูปฏิทินเองว่าวันนี้ต้องทำงานไหน — เพิ่ม cron ที่นี่ต้องดูโควตารวมของทั้งบัญชีก่อนเสมอ
[triggers]
crons = [
  "*/15 * * * *",  # reminders   — เตือนซ้ำเรื่องที่เกิน SLA
  "0 3 * * *",     # daily-jobs  — db-keepalive ทุกวัน · backup วันอาทิตย์ · cleanup-files + usage-report วันที่ 1
]

# รหัสรุ่นที่ deploy อยู่จริง — /api/health เอาไปบอกว่าเครื่องกำลังรันของรอบไหน
#
# มีไว้เพราะเคยเสียเวลาไล่หาสาเหตุว่า "แก้แล้วทำไมหน้าจอไม่เปลี่ยน" โดยเดาเอาว่าเป็นแคช
# ทั้งที่ของใหม่ยังไม่ได้ deploy ขึ้นไปด้วยซ้ำ ต่อไปเปิด /api/health ดูเวลาที่ deploy ได้เลย
[version_metadata]
binding = "CF_VERSION"
