# การตั้งค่า Cloudflare Workers สำหรับ Horizon Core — ระบบกลางขององค์กร
#
# deploy แยกจากระบบแจ้งปัญหา:  npx wrangler deploy --config wrangler.core.toml
#
# Worker ตัวนี้ทำแค่ลงทะเบียนพนักงานกับหน้าจัดการข้อมูลของ HR ไม่มีงานตามเวลา
# และไม่รับ webhook ของไลน์ (ตัวรับ webhook ยังเป็นระบบแจ้งปัญหาเหมือนเดิม)
#
# ใช้ฐานข้อมูลตัวเดียวกับระบบอื่น จึงต้องตั้ง DATABASE_URL, LINE_LOGIN_CHANNEL_ID
# และ ADMIN_EMPLOYEE_CODES ที่ Worker ตัวนี้ด้วย (Settings → Variables and Secrets)
# ค่าลับห้ามใส่ลงไฟล์นี้เพราะไฟล์นี้อยู่ใน repo สาธารณะ

name = "core"
main = "src/core.ts"
compatibility_date = "2025-01-01"

# postgres ต้องใช้ TCP · node:crypto ใช้ตรวจ ID token ของไลน์
compatibility_flags = ["nodejs_compat"]

# หน้าเว็บของระบบกลาง — คนละชุดกับ public/ ของระบบแจ้งปัญหา
# หน้านี้ไม่ได้ถูกแชร์เป็นลิงก์ในแชท จึงไม่ต้องเติมโดเมนใน og:* แต่ยังต้องผ่าน Worker ด้วยเหตุผลข้างล่าง
# run_worker_first — เส้นทางที่ต้องผ่านโค้ดของเราก่อน ที่เหลือ Cloudflare เสิร์ฟตรงจากที่เก็บไฟล์
#
# ต้องมีครบทั้งสี่เส้นทางของ APP_SHELL (ดู api/_lib/assets.ts) เพราะ serveAsset ทำสองอย่าง
# ที่จำเป็นกับไฟล์เหล่านี้ และจะไม่ได้ทำเลยถ้าคำขอไม่วิ่งผ่าน Worker:
#   1. ตัดคอมเมนต์ออกก่อนส่ง — ไม่งั้นคนกด inspect element อ่านคำอธิบายในโค้ดได้หมด
#   2. ใส่ cache-control: no-store — ไม่งั้นเบราว์เซอร์ในแอปไลน์เก็บตัวแอปเก่าไว้แน่นมาก
# เดิมไม่ได้ตั้งไว้เลย ไฟล์ทุกไฟล์จึงถูกเสิร์ฟข้าม Worker และไม่ได้ทั้งสองอย่าง
[assets]
directory = "./public-core"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/app.js", "/config.js"]

# ไม่มี [vars] — Worker ตัวนี้ไม่ต้องรู้ LIFF ID
#
# ฝั่งเซิร์ฟเวอร์อ่าน LIFF_ID ที่เดียวคือ _lib/flex.ts ซึ่งเป็นตัวประกอบลิงก์ "เปิดในแอป"
# บนปุ่มของการ์ดที่ส่งเข้าไลน์ ระบบกลางไม่ได้ส่งการ์ดเข้าไลน์จึงไม่แตะไฟล์นั้นเลย
#
# LIFF ID ของระบบกลางอยู่ใน public-core/config.js ซึ่งเป็นฝั่งเบราว์เซอร์ คนละตัวกัน

# รหัสรุ่นที่ deploy อยู่จริง — /api/health เอาไปบอกว่าเครื่องกำลังรันของรอบไหน
#
# มีไว้เพราะเคยเสียเวลาไล่หาสาเหตุว่า "แก้แล้วทำไมหน้าจอไม่เปลี่ยน" โดยเดาเอาว่าเป็นแคช
# ทั้งที่ของใหม่ยังไม่ได้ deploy ขึ้นไปด้วยซ้ำ ต่อไปเปิด /api/health ดูเวลาที่ deploy ได้เลย
[version_metadata]
binding = "CF_VERSION"
